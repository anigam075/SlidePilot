<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlidePilot</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>
    <div class="bg-orb orb-c" aria-hidden="true"></div>
    <main class="app-shell">
      <section class="card intro-card">
        <p class="brand-pill">AI Presentation Copilot</p>
        <h1>SlidePilot</h1>
        <p class="muted">Drop your .pptx and let SlidePilot take the mic.</p>

        <form id="uploadForm">
          <input type="file" id="pptFile" accept=".pptx" required />
          <button type="submit">Upload Deck</button>
        </form>

        <div id="status" class="status"></div>
      </section>

      <section class="card hidden" id="deckPanel">
        <div class="slide-header">
          <h2 id="slideTitle">Slide 1</h2>
          <span id="slideCounter"></span>
        </div>
        <div class="presentation-grid">
          <div class="media-pane">
            <img id="slideImage" class="slide-image hidden" alt="Slide preview" />
            <p id="slideImageHint" class="muted"></p>
          </div>

          <div class="control-pane">
            <div class="actions">
              <button id="prevBtn">Previous</button>
              <button id="narrateBtn">Start Presentation</button>
            </div>

            <p id="scriptBox" class="script-box"></p>

            <div class="qna hidden" id="qnaSection">
              <h3>QnA (After Presentation)</h3>
              <textarea id="questionInput" placeholder="Ask a question about the full presentation"></textarea>
              <button id="askBtn">Ask</button>
              <p id="answerBox" class="answer-box"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
